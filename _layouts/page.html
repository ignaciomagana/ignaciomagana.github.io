---
layout: default
---
<main id="main">
  <div class="container">
    <article class="article prose">
      <header class="article__header">
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
      </header>
      <div class="article__body">
        {{ content }}
      </div>
    </article>
  </div>
</main>
