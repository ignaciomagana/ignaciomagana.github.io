<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#14202b" />
<title>Digital World 3D — Browser Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}canvas{display:block;width:100%;height:100%;touch-action:none;background:linear-gradient(#7dc7ff,#dff5ff 55%,#78a85c 55%)}
#ui{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #0008}.panel{background:#07121dcc;border:1px solid #ffffff2b;border-radius:13px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#stats{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));padding:10px 12px;min-width:250px;font-size:12px}.title{font-size:17px;font-weight:900;color:#ffd65b}.barrow{display:grid;grid-template-columns:55px 1fr 35px;gap:6px;align-items:center;margin-top:4px}.bar{height:7px;background:#132333;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#60cf78}.bar.blue i{background:#62baf7}.bar.orange i{background:#f6b45c}
#clock{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));padding:9px 11px;text-align:right;font-size:12px;font-weight:800}.green{color:#a5efad}
#msg{position:absolute;left:50%;bottom:106px;transform:translateX(-50%);padding:10px 14px;min-width:260px;max-width:min(700px,90vw);text-align:center;font-weight:800;opacity:0;transition:.2s;border-radius:12px}#msg.on{opacity:1}
#prompt{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);padding:7px 11px;font-size:13px;font-weight:900;color:#fff1a8;border-radius:10px;min-width:220px;text-align:center}
#help{position:absolute;right:10px;bottom:10px;padding:7px 9px;font-size:10px;opacity:.85}
#start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#37698c,#070b10 75%);z-index:30;padding:16px}.card{width:min(620px,95vw);padding:25px;border-radius:20px;text-align:center;background:#08131ee8;border:1px solid #ffffff30;box-shadow:0 20px 60px #0009}.card h1{font-size:clamp(34px,9vw,62px);margin:0;line-height:.9;color:#70c8ff;text-shadow:0 4px 0 #18384c}.card h1 b{color:#ffd653}.card p{opacity:.85}.card button{border:0;border-radius:12px;background:#2d80c8;color:#fff;font:inherit;font-weight:900;padding:13px 24px;font-size:17px;box-shadow:0 8px 20px #0007}.card small{display:block;margin-top:12px;opacity:.65}
#touch{display:none;position:fixed;inset:0;z-index:20;pointer-events:none}#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:#0f1b2766;border:2px solid #fff4;pointer-events:auto;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#ffffff77;border:2px solid #fff8}#camPad{position:absolute;right:0;top:0;width:55%;height:70%;pointer-events:auto;touch-action:none}#buttons{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,61px);gap:7px;pointer-events:auto}#buttons button{height:48px;border:1px solid #ffffff42;border-radius:12px;background:#183754dd;color:#fff;font-size:10px;font-weight:900}#buttons .act{background:#a86117ee}
@media(hover:none),(pointer:coarse){#touch{display:block}#help{display:none}#prompt{bottom:154px}#msg{bottom:205px}#clock{top:auto;bottom:175px}#stats{min-width:210px;font-size:10px}.title{font-size:14px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div id="stats" class="panel"></div><div id="clock" class="panel"></div><div id="msg" class="panel"></div><div id="prompt" class="panel">Walk around File City</div><div id="help" class="panel">WASD move · drag mouse rotate · F feed · R rest · B toilet · P praise · K scold · E interact · C attack · 5 save · 9 load</div></div>
<div id="start"><div class="card"><h1>DIGITAL WORLD <b>3D</b></h1><p>A dependency-free browser prototype inspired by the original creature-raising loop.</p><button id="play">PLAY</button><small>No WebGL, CDN, install, or game files required.</small></div></div>
<div id="touch"><div id="camPad"></div><div id="stick"><div id="knob"></div></div><div id="buttons"><button data-a="feed">FEED</button><button class="act" data-a="interact">ACT</button><button data-a="attack">ATTACK</button><button data-a="praise">PRAISE</button><button data-a="rest">REST</button><button data-a="toilet">TOILET</button><button data-a="scold">SCOLD</button><button data-a="save">SAVE</button><button data-a="load">LOAD</button></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d',{alpha:false});
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),D=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
let W=0,H=0,dpr=1;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let started=false,yaw=.15,pitch=.30,worldMin=8*60,prosperity=0,msgT=0,last=performance.now(),touchMove={x:0,y:0};
const player={x:0,z:13,y:0,r:.58},partner={x:2,z:13,y:0,r:.65,stage:'Rookie'},P={name:'Agumon',hp:900,maxHp:900,mp:700,maxMp:700,hunger:25,tired:15,toilet:10,happy:55,discipline:45,weight:18,age:1,off:70,def:65,spd:60,brains:50};
const colors={ground:'#769f56',path:'#b79f77',water:'#4ea9d8',roof:'#8b4938',wood:'#76523b',stone:'#8f999c',orange:'#e79a33',green:'#5d9b55',blue:'#6ca9d9',red:'#b85850'};
const buildings=[
{x:-9,z:2,w:5,d:5,h:4.5,label:'ITEM',col:'#8d6d43'},{x:-3,z:-2,w:5,d:5,h:5.5,label:'BANK',col:'#778c86'},{x:4,z:-3,w:6,d:5,h:5,label:'HOSPITAL',col:'#a7a39a'},{x:9,z:2,w:6,d:5,h:6,label:'TRAINING',col:'#6f685a'},{x:-7,z:-8,w:5,d:4,h:4,label:'WAREHOUSE',col:'#67564d'}];
const trees=[];for(let i=0;i<20;i++){const a=i*1.71+1.2,r=18+(i%4)*2;trees.push({x:Math.cos(a)*r,z:Math.sin(a)*r,h:3+(i%3)})}
const recruits=[{x:-11,z:9,name:'Palmon',done:false},{x:12,z:9,name:'Patamon',done:false},{x:-12,z:-8,name:'Gabumon',done:false}];
const enemies=[{x:14,z:-9,name:'Goburimon',hp:160,max:160},{x:17,z:-5,name:'Goburimon',hp:160,max:160}];
const pads=[{x:8,z:6,stat:'off',label:'OFF'},{x:10.5,z:6,stat:'def',label:'DEF'},{x:8,z:8.5,stat:'spd',label:'SPD'},{x:10.5,z:8.5,stat:'brains',label:'BRA'}];
function camera(){const follow=11,cy=7.2;return{x:player.x-Math.sin(yaw)*follow,z:player.z-Math.cos(yaw)*follow,y:cy+Math.sin(pitch)*4}}
function project(x,y,z){const cam=camera(),dx=x-cam.x,dy=y-cam.y,dz=z-cam.z,sy=Math.sin(yaw),cy=Math.cos(yaw);let rx=dx*cy-dz*sy,rz=dx*sy+dz*cy;const sp=Math.sin(pitch),cp=Math.cos(pitch);let ry=dy*cp-rz*sp;rz=dy*sp+rz*cp;const near=.4;if(rz<=near)return null;const f=Math.min(W,H)*1.06;return{x:W/2+rx/rz*f,y:H*.47-ry/rz*f,s:f/rz,z:rz}}
function poly(points,fill,stroke){const p=points.map(v=>project(...v));if(p.some(v=>!v))return;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function box(o){const x=o.x,z=o.z,w=o.w,d=o.d,h=o.h,y=o.y||0,top=o.top||shade(o.col,18);const X=x-w/2,x2=x+w/2,Z=z-d/2,z2=z+d/2;const faces=[{p:[[X,y,Z],[x2,y,Z],[x2,y+h,Z],[X,y+h,Z]],c:shade(o.col,-15),d:(Z+z)/2},{p:[[x2,y,Z],[x2,y,z2],[x2,y+h,z2],[x2,y+h,Z]],c:shade(o.col,-3),d:(x2+x)/2},{p:[[x2,y,z2],[X,y,z2],[X,y+h,z2],[x2,y+h,z2]],c:o.col,d:(z2+z)/2},{p:[[X,y,z2],[X,y,Z],[X,y+h,Z],[X,y+h,z2]],c:shade(o.col,-22),d:(X+x)/2},{p:[[X,y+h,Z],[x2,y+h,Z],[x2,y+h,z2],[X,y+h,z2]],c:top,d:999}];for(const f of faces)poly(f.p,f.c,'#0003')}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return`rgb(${r},${g},${b})`}
function billboard(x,y,z,r,col,label){const p=project(x,y,z);if(!p)return;const rr=Math.max(2,r*p.s*1.4);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(p.x,p.y+rr*.7,rr*.75,rr*.25,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y-rr*.25,rr*.65,0,Math.PI*2);ctx.fill();ctx.fillStyle=shade(col,25);ctx.beginPath();ctx.arc(p.x,p.y-rr*.9,rr*.43,0,Math.PI*2);ctx.fill();if(label&&rr>9){ctx.font=`700 ${clamp(rr*.45,9,16)}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(label,p.x,p.y-rr*1.55);ctx.fillText(label,p.x,p.y-rr*1.55)}}
function ground(){ctx.fillStyle='#83c9f5';ctx.fillRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#68b7ef');sky.addColorStop(.55,'#d7efff');sky.addColorStop(.551,'#6d9851');sky.addColorStop(1,'#3e693a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);poly([[-30,0,-30],[30,0,-30],[30,0,30],[-30,0,30]],colors.ground);poly([[-4,.02,-22],[4,.02,-22],[4,.02,24],[-4,.02,24]],colors.path);poly([[-22,.025,-4],[22,.025,-4],[22,.025,4],[-22,.025,4]],colors.path);poly([[-22,.03,-16],[-13,.03,-16],[-13,.03,-7],[-22,.03,-7]],colors.water)}
function drawWorld(){ground();const draw=[];for(const b of buildings)draw.push({z:D(b,camera()),fn:()=>{box(b);const p=project(b.x,b.h+.6,b.z);if(p){ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff4a8';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(b.label,p.x,p.y);ctx.fillText(b.label,p.x,p.y)}}});for(const t of trees)draw.push({z:D(t,camera()),fn:()=>{box({x:t.x,z:t.z,w:.45,d:.45,h:1.7,col:'#6e4d36'});billboard(t.x,3,t.z,1.5,'#4f8650')}});for(const p of pads)draw.push({z:D(p,camera()),fn:()=>{box({x:p.x,z:p.z,w:1.8,d:1.8,h:.18,col:'#d7b051'});const q=project(p.x,.3,p.z);if(q){ctx.fillStyle='#17222b';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText(p.label,q.x,q.y)}}});for(const r of recruits)if(!r.done)draw.push({z:D(r,camera()),fn:()=>billboard(r.x,0,r.z,.8,'#7dc56e',r.name)});for(const e of enemies)if(e.hp>0)draw.push({z:D(e,camera()),fn:()=>billboard(e.x,0,e.z,.82,'#84694d',e.name)});draw.push({z:D(partner,camera()),fn:()=>billboard(partner.x,0,partner.z,partner.stage==='Champion'?1.05:.86,partner.stage==='Champion'?'#c56b35':'#e7a338',P.name)});draw.push({z:D(player,camera()),fn:()=>billboard(player.x,0,player.z,.72,'#2c5e88','You')});draw.sort((a,b)=>b.z-a.z);for(const d of draw)d.fn()}
function nearest(){let best=null,bd=3.2;for(const r of recruits)if(!r.done){const d=D(player,r);if(d<bd){bd=d;best={kind:'recruit',o:r}}}for(const p of pads){const d=D(player,p);if(d<bd){bd=d;best={kind:'pad',o:p}}}for(const e of enemies)if(e.hp>0){const d=D(player,e);if(d<bd){bd=d;best={kind:'enemy',o:e}}}return best}
function show(s){$('#msg').textContent=s;$('#msg').classList.add('on');msgT=2.8}
function interact(){const n=nearest();if(!n)return show('Nothing to interact with here.');if(n.kind==='recruit'){n.o.done=true;prosperity+=2;show(`${n.o.name} joined File City! Prosperity +2.`)}else if(n.kind==='pad'){P[n.o.stat]+=8;P.tired=clamp(P.tired+15,0,100);P.hunger=clamp(P.hunger+10,0,100);show(`${n.o.label} training complete!`);evolve()}else show(`${n.o.name} looks ready to fight.`)}
function attack(){let target=null,bd=7;for(const e of enemies)if(e.hp>0){const d=D(partner,e);if(d<bd){bd=d;target=e}}if(!target)return show('No enemy close enough.');target.hp-=50+Math.floor(P.off*.15);show(`${P.name} attacks ${target.name}!`);if(target.hp<=0){prosperity++;show(`${target.name} defeated. Prosperity +1.`)}}
function feed(){P.hunger=clamp(P.hunger-32,0,100);P.weight+=1;P.happy=clamp(P.happy+4,0,100);show(`${P.name} ate a Digimushroom.`)}function rest(){P.tired=clamp(P.tired-38,0,100);P.hp=clamp(P.hp+120,0,P.maxHp);show(`${P.name} took a rest.`)}function toilet(){P.toilet=0;P.happy=clamp(P.happy+2,0,100);show('Bathroom crisis avoided.')}function praise(){P.happy=clamp(P.happy+9,0,100);P.discipline=clamp(P.discipline-2,0,100);show(`${P.name} is happy!`)}function scold(){P.discipline=clamp(P.discipline+8,0,100);P.happy=clamp(P.happy-4,0,100);show(`${P.name} straightens up.`)}
function evolve(){if(partner.stage==='Rookie'&&P.off+P.def+P.spd+P.brains>=330){partner.stage='Champion';P.name=P.off>=P.spd?'Greymon':'Garurumon';P.maxHp+=250;P.hp=P.maxHp;show(`${P.name} digivolved!`)}}
function save(){try{localStorage.setItem('dw3d-save',JSON.stringify({P,player,partner,prosperity,worldMin,recruits:recruits.map(r=>r.done),enemies:enemies.map(e=>e.hp)}));show('Saved in this browser.')}catch(e){show('Browser blocked saving, but the game still runs.')}}function load(){try{const d=JSON.parse(localStorage.getItem('dw3d-save')||'null');if(!d)return show('No save found.');Object.assign(P,d.P);Object.assign(player,d.player);Object.assign(partner,d.partner);prosperity=d.prosperity||0;worldMin=d.worldMin||480;(d.recruits||[]).forEach((v,i)=>recruits[i].done=v);(d.enemies||[]).forEach((v,i)=>enemies[i].hp=v);show('Loaded.')}catch(e){show('Save unavailable.')}}
const actions={feed,rest,toilet,praise,scold,interact,attack,save,load};function action(a){actions[a]?.()}
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.code);if(e.repeat)return;const m={KeyF:'feed',KeyR:'rest',KeyB:'toilet',KeyP:'praise',KeyK:'scold',KeyE:'interact',Space:'interact',KeyC:'attack',Digit5:'save',Digit9:'load'};if(m[e.code]){e.preventDefault();action(m[e.code])}});addEventListener('keyup',e=>keys.delete(e.code));
let dragging=false,lx=0; c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dragging=true;lx=e.clientX}});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging&&e.pointerType==='mouse'){yaw-=(e.clientX-lx)*.006;lx=e.clientX}});
for(const b of document.querySelectorAll('#buttons button'))b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.a)});
const stick=$('#stick'),knob=$('#knob');let sid=null;function sm(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,L=Math.hypot(dx,dy),M=r.width*.34;if(L>M){dx*=M/L;dy*=M/L}touchMove={x:dx/M,y:dy/M};knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);sm(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)sm(e)});function su(e){if(e.pointerId!==sid)return;sid=null;touchMove={x:0,y:0};knob.style.transform=''}stick.addEventListener('pointerup',su);stick.addEventListener('pointercancel',su);
const cp=$('#camPad');let cid=null,cx=0;cp.addEventListener('pointerdown',e=>{cid=e.pointerId;cx=e.clientX;cp.setPointerCapture(cid)});cp.addEventListener('pointermove',e=>{if(e.pointerId===cid){yaw-=(e.clientX-cx)*.008;cx=e.clientX}});cp.addEventListener('pointerup',()=>cid=null);
$('#play').onclick=()=>{$('#start').style.display='none';started=true};if(location.hash==='#play'){ $('#start').style.display='none';started=true }
function update(dt){let ix=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+touchMove.x,iz=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0)-touchMove.y;const L=Math.hypot(ix,iz);if(L>.05){ix/=Math.max(1,L);iz/=Math.max(1,L);const s=5.2*dt,sy=Math.sin(yaw),cy=Math.cos(yaw);player.x+= (ix*cy+iz*sy)*s;player.z+=(-ix*sy+iz*cy)*s;player.x=clamp(player.x,-25,25);player.z=clamp(player.z,-25,25)}const dx=player.x-partner.x,dz=player.z-partner.z,dl=Math.hypot(dx,dz);if(dl>2.1){partner.x+=dx/dl*Math.min(dl-1.7,4*dt);partner.z+=dz/dl*Math.min(dl-1.7,4*dt)}worldMin+=dt*2.4;if(worldMin>=1440){worldMin-=1440;P.age++;show(`${P.name} is now age ${P.age}.`)}P.hunger=clamp(P.hunger+dt*.10,0,100);P.tired=clamp(P.tired+dt*.055,0,100);P.toilet=clamp(P.toilet+dt*.07,0,100);if(P.hunger>90||P.toilet>95)P.happy=clamp(P.happy-dt*.15,0,100);if(msgT>0){msgT-=dt;if(msgT<=0)$('#msg').classList.remove('on')}}
function hud(){const h=Math.floor(worldMin/60)%24,m=Math.floor(worldMin%60),n=nearest();$('#prompt').textContent=n?(n.kind==='recruit'?`ACT: invite ${n.o.name}`:n.kind==='pad'?`ACT: train ${n.o.label}`:`C: fight ${n.o.name}`):'Explore File City';$('#clock').innerHTML=`Year 1 · Day ${P.age} · ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}<br><span class="green">Prosperity ${prosperity}</span>`;const bar=(name,v,cls='')=>`<div class="barrow"><span>${name}</span><div class="bar ${cls}"><i style="width:${clamp(v,0,100)}%"></i></div><b>${Math.round(v)}</b></div>`;$('#stats').innerHTML=`<div class="title">${P.name} · ${partner.stage}</div>${bar('HP',P.hp/P.maxHp*100)}${bar('MP',P.mp/P.maxMp*100,'blue')}${bar('Hunger',P.hunger,'orange')}<div style="margin-top:6px;opacity:.9">Off ${P.off} · Def ${P.def} · Spd ${P.spd} · Brn ${P.brains}<br>Happy ${Math.round(P.happy)} · Disc ${Math.round(P.discipline)} · Wt ${P.weight}</div>`}
function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;if(started)update(dt);drawWorld();hud();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body></html>
