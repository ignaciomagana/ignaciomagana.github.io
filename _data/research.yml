# Research themes rendered on the home page and /research/ (refs only on /research/).
# Plain language for a general reader; every claim traces to the CV.
- title: The masses of merging black holes
  blurb: >-
    Flexible statistical models, which let the data rather than a fixed formula
    decide the shape, map how the masses of merging black holes are spread out
    and search for distinct groups among them, while correcting for the mergers
    that detectors are likely to miss. They find evidence for the start of a gap
    in black hole masses, a range where stars are expected to blow themselves
    apart and leave no black hole behind, though a feature like this does not by
    itself reveal how the black holes formed.
  tags: [black hole masses, flexible statistics, gap in black hole masses, what detectors miss]
  refs:
    - { label: "Ray et al. 2023", arxiv: "2304.08046" }
    - { label: "Ray et al. 2025", arxiv: "2404.03166" }
    - { label: "A possible feature near 70 solar masses", arxiv: "2407.02460" }
    - { label: "Where the mass gap begins", arxiv: "2508.19208" }
    - { label: "Forecasts for the LISA space mission", arxiv: "2610.37617" }

- title: Measuring how fast the Universe expands
  blurb: >-
    The gravitational-wave signal from each merger tells how far away it is,
    while the expansion of the Universe stretches that signal on its way to us
    and makes the black holes look heavier than they are. Measuring that
    stretch, either from the overall pattern of black hole masses or from the
    galaxies that could have hosted the merger (mapped by the DESI galaxy
    survey), gives the Hubble constant, the rate at which the Universe expands,
    without the chain of stepwise distance measurements that astronomers usually
    rely on.
  tags: [Hubble constant, expanding Universe, black hole masses, galaxy surveys, DESI galaxy survey, open-source software]
  refs:
    - { label: "Expansion rate from black hole masses", arxiv: "2509.03607" }
    - { label: "Magaña Hernandez & Ray", arxiv: "2404.02522" }
    - { label: "Gray et al. 2020 (gwcosmo)", arxiv: "1908.06050" }
    - { label: "GW190814 (LIGO–Virgo)", arxiv: "2006.12611" }
    - { label: "Dang et al.", arxiv: "2607.17284" }

- title: The galaxies where black holes merge
  blurb: >-
    Black hole pairs can form from two stars born together, in crowded star
    clusters, or in the gas disks around the giant black holes at the centers of
    some galaxies, and each path tends to place the merger in a different kind
    of galaxy: quick mergers in galaxies still making stars, late ones in
    galaxies that have stopped, and disk-made ones near those central black
    holes. Matching mergers to the galaxies that may host them, including
    galaxies mapped by DESI, can therefore reveal both how the pairs formed and
    how fast the Universe expands.
  tags: [host galaxies, star-forming galaxies, active galaxy centers, DESI galaxy survey]
  refs:
    - { label: "Hostbusters", arxiv: "2610.25866" }
    - { label: "Amsellem et al. 2026", arxiv: "2512.08818" }
    - { label: "Ashton et al. 2021", arxiv: "2009.12346" }

- title: From star birth to black hole merger
  blurb: >-
    A long wait between the birth of the stars and the merger shifts mergers
    toward later cosmic times, while a preference for stars poor in heavy
    elements, which were more common in the early Universe, shifts them earlier,
    so the two effects can cancel in how often mergers happen yet point to
    different host galaxies. Computer simulations of how pairs of stars live and
    die were used to ask how GW190814, an unusually lopsided merger, could have
    formed from two stars born together.
  tags: [time to merger, heavy elements in stars, simulations of star pairs, GW190814]
  refs:
    - { label: "Lucky Strikes", arxiv: "2511.16648" }
    - { label: "Ray et al. 2025", arxiv: "2404.03166" }

- title: Lensing, light from mergers and tests of gravity
  blurb: >-
    Earlier work helped develop ways to recognize a gravitational-wave signal
    that a galaxy's gravity has bent into several copies (lensing), used such
    copies to test whether gravitational waves stretch and squeeze space as
    Einstein's theory predicts, and used black hole mergers to test whether
    gravity leaks into hidden extra dimensions. Other work asked whether a brief
    flash of radio waves was linked to the neutron-star merger GW190425, and
    searches continue, including with DESI, for the light given off when neutron
    stars (the dense cores of dead stars) collide.
  tags: [neutron-star collisions, radio flashes, gravitational lensing, tests of Einstein's theory]
  refs:
    - { label: "A radio flash and GW190425", arxiv: "2404.02496" }
    - { label: "Lo & Magaña Hernandez 2023", arxiv: "2104.09339" }
    - { label: "Testing Einstein with lensed signals", arxiv: "2211.01272" }
    - { label: "Hidden extra dimensions", arxiv: "2112.07650" }
